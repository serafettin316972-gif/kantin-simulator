<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kantin Tycoon</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#111;font-family:system-ui,sans-serif;color:#fff;user-select:none}
canvas{display:block;width:100vw;height:100vh}.ov{position:fixed;inset:0;background:rgba(10,12,20,.88);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:9;text-align:center}
.hide{display:none!important}button,input{font:inherit;padding:10px 18px;border-radius:8px;border:0}button{background:#f5a623;color:#222;font-weight:700;cursor:pointer}input{background:#fff;color:#222}
#top{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:14px;background:rgba(0,0,0,.55);padding:6px 16px;border-radius:10px;font-weight:600}
#ords{position:fixed;left:8px;top:8px;width:230px;display:flex;flex-direction:column;gap:5px;max-height:80vh;overflow:hidden}
.o{background:rgba(0,0,0,.6);border-left:4px solid #f5a623;padding:5px 8px;border-radius:6px;font-size:13px}
#prompt{position:fixed;left:50%;top:58%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:6px 14px;border-radius:8px}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;opacity:.8}
#held{position:fixed;right:12px;bottom:12px;background:rgba(0,0,0,.6);padding:8px 14px;border-radius:8px}
#msgs{position:fixed;right:10px;top:8px;width:300px;text-align:right;font-size:14px;text-shadow:0 1px 2px #000}
#inv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);padding:14px 20px;border-radius:10px;columns:2;gap:24px}
</style></head><body>
<div id="c"></div>
<div id="lobby" class="ov"><h1>🍔 KANTİN TYCOON</h1><input id="nm" placeholder="Adın" maxlength="12"><button id="cr">Oda Kur</button>
<label style="font-size:14px"><input type="checkbox" id="ld"> Kayıtlı oyunu yükle</label><div><input id="cd" placeholder="Oda kodu" maxlength="4" style="width:110px;text-transform:uppercase"> <button id="jn">Katıl</button></div><div id="err" style="color:#f77"></div>
<small>WASD • Shift koş • E / sol tık etkileşim • sağ tık alternatif • Tab stok • ESC menü</small></div>
<div id="menu" class="ov hide"><h2>Menü</h2><div id="mcode"></div><button id="resume">Oyuna Dön</button></div>
<div id="report" class="ov hide"></div>
<div id="hud" class="hide"><div id="top"></div><div id="ords"></div><div id="cross"></div><div id="prompt" class="hide"></div><div id="held"></div><div id="msgs"></div><div id="inv" class="hide"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="game.js"></script></body></html>
