<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Okul Kantini Simülatörü</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ============ LOBBY ============ -->
  <div id="lobby" class="screen active">
    <div class="lobby-card">
      <div class="logo">
        <span class="logo-icon">🏫</span>
        <h1>Okul Kantini</h1>
        <p class="subtitle">Multiplayer Yönetim Simülatörü</p>
      </div>

      <div class="input-group">
        <label>Adın</label>
        <input type="text" id="playerName" placeholder="İsmini yaz..." maxlength="14" autocomplete="off" />
      </div>

      <div class="lobby-actions">
        <button id="btnCreate" class="btn btn-primary">
          <span>Oda Oluştur</span>
        </button>
        <div class="or">veya</div>
        <div class="join-row">
          <input type="text" id="roomCode" placeholder="Oda Kodu" maxlength="4" />
          <button id="btnJoin" class="btn btn-secondary">Katıl</button>
        </div>
      </div>

      <div id="lobbyError" class="error-msg hidden"></div>

      <div id="lobbyPlayers" class="lobby-players hidden">
        <h3>Oyuncular <span id="playerCount">0</span>/4</h3>
        <ul id="playerList"></ul>
        <button id="btnStart" class="btn btn-success hidden">Oyunu Başlat</button>
        <p class="room-code-display">Oda Kodu: <strong id="displayCode"></strong></p>
      </div>
    </div>
  </div>

  <!-- ============ GAME ============ -->
  <div id="game" class="screen">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="stat money">
          <span class="stat-icon">💰</span>
          <span id="money">250</span><small>₺</small>
        </div>
        <div class="stat rep">
          <span class="stat-icon">⭐</span>
          <span id="reputation">50</span>
        </div>
      </div>
      <div class="topbar-center">
        <div class="day-time">
          <span id="dayLabel">Gün 1</span>
          <span id="timeLabel">08:00</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="players-mini" id="playersMini"></div>
      </div>
    </header>

    <main class="game-layout">
      <!-- Left Panel: Inventory + Shop -->
      <aside class="panel left-panel">
        <div class="panel-section">
          <h2>📦 Envanter</h2>
          <div id="inventoryList" class="item-grid"></div>
        </div>
        <div class="panel-section">
          <h2>🛒 Malzeme Al</h2>
          <div id="shopList" class="shop-grid"></div>
        </div>
      </aside>

      <!-- Center: Canteen Visual + Customers -->
      <section class="center-area">
        <div class="canteen-visual">
          <div class="counter">
            <div class="counter-label">Tezgah</div>
            <div id="prepSlots" class="prep-slots"></div>
            <div id="readyFoods" class="ready-foods"></div>
          </div>
          <div class="customer-area">
            <h3>Müşteriler</h3>
            <div id="customerList" class="customer-list"></div>
          </div>
        </div>

        <div class="log-panel">
          <h3>📋 Aktivite</h3>
          <ul id="activityLog"></ul>
        </div>
      </section>

      <!-- Right Panel: Recipes + Upgrades -->
      <aside class="panel right-panel">
        <div class="panel-section">
          <h2>👨‍🍳 Hazırla</h2>
          <div id="recipeList" class="recipe-grid"></div>
        </div>
        <div class="panel-section">
          <h2>⬆️ Yükseltmeler</h2>
          <div id="upgradeList" class="upgrade-list"></div>
        </div>
      </aside>
    </main>
  </div>

  <!-- ============ END SCREEN ============ -->
  <div id="endScreen" class="screen">
    <div class="end-card">
      <h1>🏫 Günler Bitti!</h1>
      <div id="finalStats"></div>
      <div id="finalRanking"></div>
      <button id="btnReplay" class="btn btn-primary">Yeni Oyun</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/client.js"></script>
</body>
</html>
